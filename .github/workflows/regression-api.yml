name: Regression API Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run in headless mode?'
        required: true
        type: boolean
        default: true
      max_instances:
        description: 'Max parallel instances'
        required: true
        type: string
        default: '5'

jobs:
  api:
    name: API Regression
    runs-on: windows-latest
    env:
      BASE_URL: https://www.cheapflights.com.au
      API_BASE_URL: https://restful-booker.herokuapp.com
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API suite
        run: npx wdio run ./config/wdio.ci.conf.js --suite api --max-instances=${{ github.event.inputs.max_instances || '5' }}
        shell: pwsh

      - name: Upload mochawesome report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-api
          path: reports/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-api
          path: logs/screenshots/
          retention-days: 7
