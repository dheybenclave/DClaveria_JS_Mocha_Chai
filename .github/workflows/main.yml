name: WDIO Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Run specific test tag (e.g., @tc_1, @api_tc_1, @booking_flight, @search_results, @home_page)'
        required: true
        default: '@tc_1'
      run_parallel:
        description: 'Run tests in parallel (max 5 instances)?'
        required: true
        type: boolean
        default: true
      headless:
        description: 'Run in headless mode?'
        required: true
        type: boolean
        default: true

jobs:
  test:
    runs-on: windows-latest
    env:
      BASE_URL: https://www.cheapflights.com.au
      API_BASE_URL: https://restful-booker.herokuapp.com
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run WDIO tests
        run: npx wdio run ./config/wdio.ci.conf.js --specs "src/specs/web/**/*.spec.js" --specs "src/specs/api/**/*.spec.js" --mochaOpts.grep="${{ github.event.inputs.test_tag }}" --maxInstances=${{ fromJSON(github.event.inputs.run_parallel || 'true') && '5' || '1' }}
        shell: pwsh

      - name: Upload mochawesome report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-tag-${{ github.event.inputs.test_tag || 'all' }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-tag-${{ github.event.inputs.test_tag || 'all' }}
          path: logs/screenshots/
          if-no-files-found: ignore
          retention-days: 7
