name: Agentic CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      run_parallel:
        description: 'Run tests in parallel?'
        required: true
        type: boolean
        default: false
      test_tag:
        description: 'Run specific test tag (e.g., @tc_1, @e2e_1, @smoke, @api_e2e_1)'
        required: false
        default: ''
      test_filter:
        description: 'Run specific test (e.g., --mochaOpts.grep="@tc_1")'
        required: false
        default: ''
      open_report:
        description: 'Auto-open mochawesome report after run?'
        type: boolean
        default: false
      target_branch:
        description: 'Target branch for test execution (leave empty for current branch)'
        required: false
        default: ''

jobs:
  setup:
    runs-on: windows-latest
    outputs:
      parallel: ${{ steps.parallel.outputs.parallel }}
      test_filter: ${{ steps.filter.outputs.test_filter }}
      open_report: ${{ steps.filter.outputs.open_report }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine parallel mode
        id: parallel
        run: |
          if "${{ github.event.inputs.run_parallel }}" == "true"; then
            echo "parallel=true" >> $GITHUB_OUTPUT
          else
            echo "parallel=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine test filter
        id: filter
        run: |
          if "${{ github.event.inputs.test_tag }}" != ""; then
            echo "test_filter=--mochaOpts.grep=\"${{ github.event.inputs.test_tag }}\"" >> $GITHUB_OUTPUT
          elif "${{ github.event.inputs.test_filter }}" != ""; then
            echo "test_filter=--mochaOpts.grep=\"${{ github.event.inputs.test_filter }}\"" >> $GITHUB_OUTPUT
          else
            echo "test_filter=" >> $GITHUB_OUTPUT
          fi
          echo "open_report=${{ github.event.inputs.open_report }}" >> $GITHUB_OUTPUT

  test:
    needs: setup
    runs-on: windows-latest
    env:
      BASE_URL: https://www.cheapflights.com.au
      API_BASE_URL: https://restful-booker.herokuapp.com
      HEADLESS: "true"
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.setup.outputs.parallel && '5' || '1') }}
      matrix:
        suite: [regression]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run WDIO tests (tag filter)
        if: needs.setup.outputs.test_filter != ''
        run: |
          npx wdio run ./wdio.conf.js --suite regression ${{ needs.setup.outputs.test_filter }} --config.openMochawesomeReport=${{ needs.setup.outputs.open_report }} --maxInstances=5

      - name: Run WDIO tests (full regression)
        if: needs.setup.outputs.test_filter == ''
        run: |
          npx wdio run ./wdio.conf.js --suite regression --config.openMochawesomeReport=${{ needs.setup.outputs.open_report }} --maxInstances=5

      - name: Upload mochawesome report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-${{ matrix.suite }}
          path: reports/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.suite }}
          path: logs/screenshots/
          retention-days: 7

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ tests/ --ext .js

  report:
    needs: [test, lint]
    runs-on: windows-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - name: Download mochawesome report
        uses: actions/download-artifact@v4
        with:
          name: mochawesome-report-regression
          path: reports/

      - name: Generate combined HTML report
        run: |
          npx marge ./reports/wdio-ma-merged.json --reportDir ./reports --reportFilename index.html --inline --charts

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-combined-report
          path: reports/index.html
          retention-days: 30

      - name: Comment PR with report summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/index.html';
            let summary = '## Test Report\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('reports/wdio-ma-merged.json', 'utf8'));
              const passed = report.results?.reduce((acc, r) => acc + (r.passes || 0), 0);
              const failed = report.results?.reduce((acc, r) => acc + (r.failures || 0), 0);
              summary += `| Metric | Count |\n|--------|-------|\n| ✅ Passed | ${passed} |\n| ❌ Failed | ${failed} |\n`;
            } catch (e) {
              summary += 'Report details unavailable.\n';
            }
            summary += '\n📄 [View Full Report](./reports/index.html)';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });